version: '3'

services:
  app:
    build:
      context: ../
      dockerfile: yagpdb_docker/Dockerfile
    restart: unless-stopped
    command:
      - "-all"
      - "-exthttps=true"
      - "-https=false"
    depends_on:
      - redis
      - db
    networks:
      - default
    volumes:
      - ./cert_cache:/app/cert        # <-- Yerel klasöre bağlandı
      - ./soundboard:/app/soundboard  # <-- Yerel klasöre bağlandı
    ports:
      - '5000:5000'
    env_file:
      - app.env

  redis:
    image: redis
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./redis:/data                 # <-- Yerel klasöre bağlandı

  db:
    image: postgres:11
    restart: unless-stopped
    volumes:
      - ./db:/var/lib/postgresql/data # <-- Yerel klasöre bağlandı
    networks:
      - default
    env_file:
      - db.env
    ports:
      - '5432:5432'

networks:
  default:
    driver: bridge